name: Build for Android

on:
  push:                # 代码推送到任意分支时触发
  workflow_dispatch:   # 允许在 Actions 页面手动触发

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 定义目标架构，可根据需要添加
        arch: [arm64, arm]
        # 为不同架构指定对应的 NDK 编译器
        include:
          - arch: arm64
            ndk_compiler: aarch64-linux-android21-clang
            go_arch: arm64
          - arch: arm
            ndk_compiler: armv7a-linux-androideabi21-clang
            go_arch: arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'  # 使用 Go 1.22 或更新版本

      - name: Set up Android NDK
        run: |
          echo "Downloading Android NDK r26c..."
          wget -q https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q android-ndk-r26c-linux.zip
          echo "${{ github.workspace }}/android-ndk-r26c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build for Android (${{ matrix.arch }})
        env:
          GOOS: android
          GOARCH: ${{ matrix.go_arch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.ndk_compiler }}
        run: |
          go build -v -o openlist-guangyapan-android-${{ matrix.arch }} .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openlist-android-${{ matrix.arch }}
          path: openlist-guangyapan-android-${{ matrix.arch }}
