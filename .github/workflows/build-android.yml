# OpenList 安卓版自动编译脚本
name: 编译安卓版本

# 触发方式：手动点击运行（推荐）
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4

      - name: 安装 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' # 匹配项目Go版本

      - name: 编译 安卓arm64 (主流设备)
        run: |
          GOOS=android GOARCH=arm64 go build -o openlist-android-arm64 main.go
          
      - name: 编译 安卓armv7 (老设备)
        run: |
          GOOS=android GOARCH=arm go build -o openlist-android-armv7 main.go

      - name: 打包编译结果
        uses: actions/upload-artifact@v4
        with:
          name: openlist-android
          path: |
            openlist-android-arm64
            openlist-android-armv7
