name: Build Android SO

on:
  push: # 当代码推送到 main 分支时触发
    branches: [ main ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21' # 可根据项目实际要求调整版本

    - name: Setup Android NDK
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip
        # 下载 NDK r25c，可根据需要更换版本
        wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip -q android-ndk-r25c-linux.zip
        echo "ANDROID_NDK_HOME=$(pwd)/android-ndk-r25c" >> $GITHUB_ENV
        echo "NDK_ROOT=$(pwd)/android-ndk-r25c" >> $GITHUB_ENV

    - name: Build for Android arm64
      run: |
        export NDK_ROOT=$ANDROID_NDK_HOME
        export CC=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
        export GOOS=android
        export GOARCH=arm64
        export CGO_ENABLED=1
        go build -buildmode=c-shared -trimpath -ldflags="-s -w" -tags=jsoniter -o ./libopenlist.so .

    - name: Upload SO artifact
      uses: actions/upload-artifact@v4
      with:
        name: openlist-android-arm64
        path: ./libopenlist.so
