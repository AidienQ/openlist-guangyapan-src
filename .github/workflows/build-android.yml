# OpenList 安卓版编译脚本（终极稳定版）
name: 编译安卓版本

on:
  workflow_dispatch:

# 强制使用Node.js 24，消除警告
env:
  FORCE_JAVASCRIPT_ACTIONS_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 用现成的Go交叉编译镜像，不用手动装依赖
      - name: 使用Go安卓编译镜像
        uses: docker://golang:1.21-alpine
        with:
          args: |
            /bin/sh -c "
              # 编译arm64（主流安卓设备）
              CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -o /github/workspace/openlist-android-arm64 main.go;
              # 编译armv7（老安卓设备）
              CGO_ENABLED=0 GOOS=android GOARCH=arm GOARM=7 go build -o /github/workspace/openlist-android-armv7 main.go;
            "

      # 打包下载
      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: openlist-android-build
          path: |
            openlist-android-arm64
            openlist-android-armv7
